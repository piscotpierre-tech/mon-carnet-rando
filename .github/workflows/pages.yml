name: Publier le carnet sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Installer Node pour les vérifications
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Python pour les cartes
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le moteur d’images
        run: python -m pip install Pillow==12.3.0
      - name: Retrouver les cartes déjà construites
        id: catalogue-cache
        uses: actions/cache/restore@v5
        with:
          path: .generated-catalogue
          key: cartes-normandie-${{ hashFiles('catalogue/inventaire*.json', 'catalogue/route-ids.json', 'catalogue/snapshots/**', 'scripts/*catalogue.py', 'scripts/build-maps.py', 'scripts/build-elevations.py', 'scripts/trace-comparison.py') }}
          restore-keys: cartes-normandie-
      - name: Construire le catalogue, ses cartes IGN et ses profils
        run: python -u scripts/build-catalogue.py
      - name: Conserver la construction avant les vérifications finales
        if: ${{ always() && steps.catalogue-cache.outputs.cache-hit != 'true' && hashFiles('.generated-catalogue/records/*.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .generated-catalogue
          key: ${{ steps.catalogue-cache.outputs.cache-primary-key }}
      - name: Vérifier les fonctions et les fichiers
        run: |
          python -m unittest discover -s tests -p '*_test.py'
          npm test
          npm run check
      - name: Installer Chromium pour les essais mobiles et hors ligne
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps --only-shell chromium
      - name: Vérifier le carnet dans un vrai navigateur mobile
        run: node tests/browser-smoke.mjs
      - name: Conserver les captures et le rapport du navigateur
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: essais-navigateur-mobile
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Préparer les seuls fichiers publics
        run: |
          mkdir _site
          cp index.html app.js core.js data.js catalogue-routes.js styles.css sw.js manifest.webmanifest .nojekyll _site/
          cp -R assets _site/
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
